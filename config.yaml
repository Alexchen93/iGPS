app:
  author: Marcel Afsar (原作者)
  language: zh-TW
  name: iGPS 定位控制台
  theme: dark
  version: 1.0.0
database:
  backup_enabled: true
  backup_interval: 7
  path: data/favorites.db
features:
  auto_reconnect: true
  is_frozen: false
  save_last_location: true
  show_notifications: true
location:
  default_speed: 5.0
  max_speed: 100.0
  min_speed: 1.0
  update_interval: 1.0
logging:
  backup_count: 5
  file_path: data/logs/app.log
  level: INFO
  max_size: 10485760
map:
  default_center:
    latitude: 22.7826
    longitude: 120.4038
  default_zoom: 15
  tile_layer: CartoDB
ui:
  remember_position: true
  show_tooltips: true
  window_height: 850
  window_width: 1200

# ── Roam defaults ──
roam:
  default_radius: 500
  default_duration: 30
  default_speed: 35.0
  walking_speed: 5.0
  highway_speed: 80.0

# ── Route speed presets [min, max, default] ──
route:
  default_transport: driving
  default_interval: 1.0
  speed_presets:
    walking: [10, 80, 50]
    cycling: [10, 300, 150]
    driving: [10, 500, 350]
    highway: [10, 900, 800]
